# Validate every change; publish checked main-branch builds from the IQSS repository.
name: Render and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.9.38"
      - name: Chapters match the committed source
        run: scripts/split-chapters.py --check --site .
      - name: Render
        run: quarto render
      - name: Rendered site is clean
        run: scripts/check-site.py
      - name: Configure GitHub Pages
        if: github.repository_owner == 'IQSS' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload checked site
        if: github.repository_owner == 'IQSS' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.repository_owner == 'IQSS' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: render
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish checked site
        id: deployment
        uses: actions/deploy-pages@v4
