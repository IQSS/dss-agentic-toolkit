# Agentic AI Tool Chain as a Quarto website on the dss-theme extension (quarto add IQSS/dss-theme).
# Chapters are generated from the upstream markdown; see AGENTS.md for the pipeline and the no-drift contract.
# Nothing executes: the source is prose and pre-built SVG figures.
# The render-time filter is generated by `just sync`; it strips authoring comments, points figure and
# in-document links at the right page, and turns section references into links. See AGENTS.md.
filters:
  - filters/site-filter.lua

# The filter's styling counterpart, generated alongside it by `just sync`.
format:
  dss-theme-html:
    lightbox: true
    include-after-body: prompt-controls.html
    css:
      - site.css
      - figures-dark.css

project:
  type: dss-theme
  output-dir: _site
  render:
    - index.qmd
    - 404.qmd
    - "chapters/*.qmd"

website:
  title: "Extending Your Agent's Toolkit"
  # Cloudflare Pages, direct upload from `just deploy`. Behind Cloudflare Access while the
  # content is polished; it changes if the site ever moves to IQSS.
  site-url: https://dss-agentic-toolkit.pages.dev
  repo-url: https://github.com/stevenworthington/dss-agentic-toolkit
  page-navigation: true
  sidebar:
    style: floating
    search: true
    collapse-level: 1
    contents:
      - index.qmd
      # BEGIN chapters -- generated by split-chapters.py, do not edit
      - section: "Part I — Foundations"
        contents:
          - chapters/choose-tools.qmd
          - chapters/tool-access.qmd
      - section: "Part II — Install Tools And Manage Project Files"
        contents:
          - chapters/adding-tools.qmd
          - chapters/version-control.qmd
          - chapters/finding-files.qmd
      - section: "Part III — Run And Reproduce Research"
        contents:
          - chapters/environments.qmd
          - chapters/project-commands.qmd
          - chapters/pipeline-dependencies.qmd
          - chapters/job-queues.qmd
          - chapters/containers.qmd
          - chapters/research-documents.qmd
      - section: "Part IV — Connect To Data And Services"
        contents:
          - chapters/credentials.qmd
          - chapters/service-connections.qmd
          - chapters/browser-work.qmd
      - section: "Part V — Run And Coordinate Agents"
        contents:
          - chapters/parallel-work.qmd
          - chapters/headless-agents.qmd
          - chapters/local-models.qmd
      - section: "Part VI — Work From The Terminal"
        contents:
          - chapters/terminal-agents.qmd
      - section: "Reference"
        contents:
          - chapters/working-environment.qmd
          - chapters/shared-settings.qmd
          - chapters/prompt-bank.qmd
          - chapters/troubleshooting.qmd
          - chapters/terminal-history.qmd
      # END chapters

