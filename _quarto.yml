# Agentic AI Tool Chain as a Quarto website on the dss-theme extension (quarto add IQSS/dss-theme).
# Chapters are generated from the upstream markdown; see AGENTS.md for the pipeline and the no-drift contract.
# Nothing executes: the source is prose and pre-built SVG figures.
# The render-time filter is generated by `just sync`; it strips authoring comments, points figure and
# in-document links at the right page, and turns section references into links. See AGENTS.md.
filters:
  - filters/site-filter.lua

# The filter's styling counterpart, generated alongside it by `just sync`.
format:
  dss-theme-html:
    css:
      - site.css
      - figures-dark.css

project:
  type: dss-theme
  output-dir: _site
  render:
    - index.qmd
    - "chapters/*.qmd"

website:
  title: "Extending Your Agent's Toolkit"
  # Cloudflare Pages, direct upload from `just deploy`. Behind Cloudflare Access while the
  # content is polished; it changes if the site ever moves to IQSS.
  site-url: https://dss-agentic-toolchain.pages.dev
  repo-url: https://github.com/stevenworthington/dss-agentic-toolchain
  page-navigation: true
  sidebar:
    style: floating
    search: true
    collapse-level: 1
    contents:
      - index.qmd
      # BEGIN chapters -- generated by split-chapters.py, do not edit
      - chapters/00-introduction.qmd
      - section: "Part I — What An Agent Has, And What It Lacks"
        contents:
          - chapters/01-an-agent-is-a-model-with-tools.qmd
          - chapters/02-your-starting-toolkit-and-how-to-grow-it-homebrew.qmd
          - chapters/03-telling-the-agent-what-it-has-instruction-files-and-skills.qmd
          - chapters/04-keeping-the-agents-reach-in-proportion-permission-settings-and-the-os-sandbox.qmd
      - section: "Part II — The Core Set"
        contents:
          - chapters/05-find-and-read-things-fast-rg-fd-jq-yq-bat.qmd
          - chapters/06-undo-anything-and-work-with-github-git-and-gh.qmd
          - chapters/07-run-long-jobs-in-your-own-queue-pueue.qmd
          - chapters/08-one-command-for-every-task-in-a-project-just.qmd
          - chapters/09-pin-the-language-and-its-packages-rig-and-renv-uv.qmd
          - chapters/10-turn-the-analysis-into-a-paper-or-a-deck-quarto-and-pandoc.qmd
      - section: "Part III — Reproducible And Safe"
        contents:
          - chapters/11-re-run-only-what-changed-targets-and-snakemake.qmd
          - chapters/12-keep-keys-and-tokens-out-of-your-files-1password-and-direnv.qmd
          - chapters/13-check-what-the-agent-changed-tests-and-diff-review.qmd
          - chapters/14-see-what-the-agent-spent-so-the-allowance-lasts-ccusage.qmd
          - chapters/15-contain-the-agent-completely-a-container.qmd
      - section: "Part IV — Reaching Further"
        contents:
          - chapters/16-connect-the-agent-to-data-and-services-and-let-it-remember-mcp-memory.qmd
          - chapters/17-let-the-agent-use-a-browser-and-the-screen.qmd
          - chapters/18-run-several-agents-at-once-git-worktrees.qmd
          - chapters/19-version-control-for-your-tools-settings-chezmoi.qmd
      - section: "Part V — Working In The Terminal Yourself"
        contents:
          - chapters/20-why-use-the-terminal-instead-of-the-app.qmd
          - chapters/21-the-agent-in-a-terminal-claude-code.qmd
          - chapters/22-a-terminal-worth-working-in-iterm2-windows-terminal.qmd
          - chapters/23-the-shell-its-framework-and-the-prompt-zsh-oh-my-zsh-oh-my-posh.qmd
          - chapters/24-keep-sessions-alive-and-watch-several-things-at-once-zellij.qmd
          - chapters/25-an-editor-beside-the-terminal-positron.qmd
      # END chapters

