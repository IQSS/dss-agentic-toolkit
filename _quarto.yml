# Agentic AI Tool Chain as a Quarto website on the dss-theme extension (quarto add IQSS/dss-theme).
# Chapters are generated from the upstream markdown; see AGENTS.md for the pipeline and the no-drift contract.
# Nothing executes: the source is prose and pre-built SVG figures.
# The render-time filter is generated by `just sync`; it strips authoring comments, points figure and
# in-document links at the right page, and turns section references into links. See AGENTS.md.
filters:
  - filters/site-filter.lua

# The filter's styling counterpart, generated alongside it by `just sync`.
format:
  dss-theme-html:
    css:
      - site.css
      - figures-dark.css

project:
  type: dss-theme
  output-dir: _site
  render:
    - index.qmd
    - "chapters/*.qmd"

website:
  title: "Agentic AI Tool Chain"
  # Cloudflare Pages, direct upload from `just deploy`. Behind Cloudflare Access while the
  # content is polished; it changes if the site ever moves to IQSS.
  site-url: https://dss-agentic-toolchain.pages.dev
  repo-url: https://github.com/stevenworthington/dss-agentic-toolchain
  page-navigation: true
  sidebar:
    style: floating
    search: true
    collapse-level: 1
    contents:
      - index.qmd
      # BEGIN chapters -- generated by split-chapters.py, do not edit
      - chapters/00-introduction.qmd
      - chapters/01-foundation.qmd
      - chapters/02-configuration-and-environment.qmd
      - chapters/03-documentation-production.qmd
      - chapters/04-terminal-emulator.qmd
      - chapters/05-shell-framework-and-prompt.qmd
      - chapters/06-session-persistence-and-pane-management.qmd
      - chapters/07-long-running-jobs.qmd
      - chapters/08-programming-languages.qmd
      - chapters/09-ide-and-ide-side-agent.qmd
      - chapters/10-cli-agentic-coding-tools.qmd
      - chapters/11-browser-and-computer-use.qmd
      - chapters/12-context-and-memory.qmd
      - chapters/13-permissions-and-sandboxing.qmd
      - chapters/14-agent-telemetry.qmd
      - chapters/15-reproducible-pipelines-and-human-qa.qmd
      - chapters/16-multi-agent-orchestration.qmd
      - chapters/17-task-management.qmd
      - chapters/18-personal-ai-assistant.qmd
      # END chapters

